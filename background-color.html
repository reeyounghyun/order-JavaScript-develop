<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤으로 배경색 변경하기</title>
    <style>
        *{font-size: 10px;}
        .bg-color{background-color: #fff;}
        .flex{display: flex; flex-direction: column;justify-content: center;align-items: center; height: 100vh; width: 100%; }
        span{font-size: 4rem; color: #fff; background-color: #000; padding: 16px 30px; text-align: center;}
        button{margin-top: 20px; width: 200px; height: 50px; border: none; background-color: #338000; color: #fff; font-size: 25px; text-align: center;}
    </style>
</head>
<body>
    <div class="bg-color">
        <div class="flex">
            <span>백그라운드 변경하기</span>
            <button type="button" class="btn">버튼</button>
        </div>
    </div>

    <script>
        // [ 기초 예시 ]
        // var bg = document.querySelector('bg-color')[0];
        // bg.style.backgroundColor = 'red';
        // 백그라운드에 컬러를 넣는 함수

        // [ 실습 ]
        function getback(){
            var letters  = '00123456789ABCDEF';
            var color = '#';
            for(var i = 0; i < 6; i++){
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
        //getback()는 값을 추출하는 함수
        //00123456789ABCDEF 는 16진수 색상코드에 사용되는 모든 문자를 문자열로 정의 
        // i < 6 색상코드가 6개 이기때문에 표시 #000000
        // for 문이 6번 반복하여 진행 

        var bg1 = document.querySelector('.bg-color');
        var btn = document.querySelector('.btn');

        btn.addEventListener('click', function(){
            bg1.style.backgroundColor = getback();
        })
        //값 추출한 함수를 이떤 이벤트를 통하여 표현할 것인지에 대한 함수
    </script>
</body>
</html>
