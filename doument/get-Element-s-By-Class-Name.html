<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementsByClassName 실습</title>
</head>
<body>
    <ol>
        <li class="actvie">또다른 html</li>
        <li class="actvie">또다른 css</li>
        <li class="actvie">또다른 jsavaScript</li>
    </ol>

    <script>
        var ols = document.getElementsByClassName("actvie")
        for(var i = 0; ols.length; i++){
            ols[i].style.color = 'blue';
        }
    </script>
</body>
</html>
